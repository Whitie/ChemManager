services:
  web:
    build: .
    volumes:
      - ./cp_static:/app/cp_static
      - ./uploads:/app/uploads
    ports:
      - 8000
    env_file: .env
    depends_on:
      - db
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file: .env
  nginx:
    build: ./nginx
    volumes:
      - ./cp_static:/app/cp_static
      - ./uploads:/app/uploads
    ports:
    - 8800:80
  depends_on:
    - web

volumes:
  postgres_data:
